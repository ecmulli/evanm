<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05040d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>KEYSTROIDS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --green:#39ff14; --amber:#ffb000; --dim:#8a7fa8; --bg:#05040d; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#000; overflow:hidden; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  body { display:flex; align-items:center; justify-content:center; font-family:"Press Start 2P", monospace; color:var(--green); }
  #wrap { position:relative; width:min(100vw, calc(100vh * 16 / 9)); aspect-ratio:16/9; container-type:inline-size; }
  canvas { width:100%; height:100%; display:block; background:var(--bg); touch-action:none; }
  #crt { pointer-events:none; position:absolute; inset:0;
    background:repeating-linear-gradient(to bottom, transparent 0, transparent 2px, rgba(0,0,0,.22) 3px);
    box-shadow:inset 0 0 12cqw rgba(0,0,0,.85); }
  #menu { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1.6cqw; background:rgba(5,4,13,.82); font-size:1.4cqw; text-align:center; z-index:1; }
  #menu.hidden { display:none; }
  h1 { margin:0 0 .5cqw; font-size:5.2cqw; color:var(--amber); letter-spacing:.3cqw;
    text-shadow:0 0 1cqw rgba(255,176,0,.6), .4cqw .4cqw 0 #7a2a00; }
  .sub { margin:0 0 1.5cqw; color:var(--dim); font-size:1.1cqw; }
  .row { display:grid; grid-template-columns:18cqw 34cqw; align-items:center; padding:.6cqw 1.2cqw; border:.2cqw solid transparent; }
  .row.sel { border-color:var(--green); box-shadow:0 0 1cqw rgba(57,255,20,.35); }
  .row .label { text-align:left; color:var(--dim); }
  .row .val { display:flex; justify-content:space-between; align-items:center; color:#fff; }
  .row.sel .val { color:var(--green); }
  .arrow { cursor:pointer; padding:0 .8cqw; color:var(--amber); }
  #desc { margin:1cqw 0 0; max-width:60cqw; min-height:3.2cqw; line-height:1.7; font-size:1cqw; color:#cfc8e8; }
  #best { margin:0; font-size:1.1cqw; color:var(--amber); }
  #launch { font:inherit; font-size:1.4cqw; color:var(--amber); background:transparent; border:.25cqw solid var(--amber);
    padding:1cqw 3cqw; cursor:pointer; box-shadow:0 0 1cqw rgba(255,176,0,.35); }
  .hint { margin:0; font-size:1cqw; color:var(--dim); }
  .blink { animation:blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }

  body.mobile #menu { font-size:3.6cqw; gap:3cqw; }
  body.mobile h1 { font-size:8.4cqw; letter-spacing:0; }
  body.mobile .sub { font-size:2.2cqw; margin-bottom:2cqw; }
  body.mobile .row { grid-template-columns:32cqw 56cqw; padding:2.2cqw 2.5cqw; border-width:.5cqw; }
  body.mobile .arrow { padding:2cqw 3cqw; }
  body.mobile #desc { font-size:2.6cqw; max-width:86cqw; min-height:10cqw; }
  body.mobile #best, body.mobile .hint { font-size:2.6cqw; }
  body.mobile #launch { font-size:4.4cqw; padding:3.5cqw 10cqw; border-width:.6cqw; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="menu">
    <h1>KEYSTROIDS</h1>
    <p class="sub">TYPE THE ROCK. HIT ENTER. SAVE THE PLANET.</p>
    <div id="rows"></div>
    <p id="desc"></p>
    <p id="best"></p>
    <button id="launch">LAUNCH</button>
    <p class="hint" id="menuhint">&uarr;&darr; SELECT &middot; &larr;&rarr; CHANGE &middot; ENTER TO LAUNCH</p>
  </div>
  <div id="crt"></div>
</div>
<script>
'use strict';
const QS = new URLSearchParams(location.search);
const MOBILE = QS.has('mobile') || (!QS.has('desktop') && matchMedia('(pointer: coarse)').matches);
const FS = MOBILE ? 1.5 : 1;
let W = 960, H = 540;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const wrap = document.getElementById('wrap');
const FONT = '"Press Start 2P", monospace';
const GREEN = '#39ff14', AMBER = '#ffb000', RED = '#ff3b3b', DIM = '#8a7fa8';

const rnd = a => a[Math.random() * a.length | 0];
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- content ----------
const HOME_WORDS = 'a as ad add ads all alas ask asks dad dads fad fads fall falls flag flags flask flasks gag gal gala gas glad glass had half hall halls has hash jag lad lads lag lags lash sad saga sag salad salads salsa sash shall slag slash dash flash gash alfalfa alaska'.split(' ');
const TOP_WORDS = 'we wet were wire tire type typo tip top toy try trip tree tower power pepper pet pier poet port pour pure put our out you yet your rope route quote quiet quite query equip write writer witty prior pretty prettier puppet territory typewriter repertoire'.split(' ');
const WORDS = `the and you that was for are with his they this have from one had word but not what all were when your can said there use each which she how their will other about out many then them these some her would make like him into time has look two more write see number way could people than first water been call who now find long down day did get come made may part over new sound take only little work know place year live back give most very after thing just name good man think say great where help through much before line right too mean old any same tell boy follow came want show also around form three small set put end does another well large must big even such because turn here why ask went men read need land different home move try kind hand picture again change play spell air away animal house point page letter mother answer found study still learn should world high every near add food between own below country plant last school father keep tree never start city earth eye light thought head under story saw left few while along might close something seem next hard open example begin life always those both paper together group often run important until children side feet car mile night walk white sea began grow took river four carry state once book hear stop without second later miss idea enough eat face watch far asteroid laser galaxy rocket planet comet orbit meteor nebula quasar gravity keyboard pixel retro blaster cosmic`.split(/\s+/);
const CODE = [
  ['x=1', 'i++', 'a+b', '()', '[]', '{}', 'fn()', 'if', '!ok', 'x<y', 'n-1', 'a,b', 'ok;', 'x.y', '"s"', '--v'],
  ['arr[i]', 'a!=b', 'x>=0', 'n%2', '&&', '||', '=>', 'f(x);', '$var', '#id', 'a==b', 'i+=1', 'p->q', 'x?y:z', '[1,2]', '{a:1}', '// ok', 'foo_bar', 'def f():', 'int x;', 'let y;'],
  ['if(x){}', 'a[i]=b;', 'x=>x*2', '{k:"v"}', '~/bin', 's.len()', '#[test]', '@Override', 'a?.b', '::new', '<div/>', '!==', 'x**2', '$(cmd)', 'fn(a,b)', 'map[k]', '0xFF', '\\n', '`${x}`', '[...a]', 'x^=y', 'a<<=1'],
];
const SYM_BITS = ['a+b', '(x)', '#1', '@me', 'x^2', '{k}', '[0]', '<b>', '50%', '$5', 'a&b', '~/', 'a|b', '"hi"', "'q'", 'x*y', 'a/b', '-v', '_id', '!?', '...', ';;', '=>', '<='];

function span(level, min, max) {
  const hi = Math.min(max, min + Math.floor((level - 1) / 2));
  return Math.floor(rand(Math.max(min, hi - 1), hi + 1));
}
const mash = (chars, len) => Array.from({ length: len }, () => rnd(chars)).join('');
const digits = n => mash('0123456789', n);
function pickWord(list, minLen, maxLen) {
  const ok = list.filter(w => w.length >= minLen && w.length <= maxLen);
  return rnd(ok.length ? ok : list);
}

const DRILLS = [
  { name: 'HOME ROW', desc: 'ASDF JKL; - where your fingers live. G and H join at level 3, words at level 4.',
    gen: l => (l >= 4 && Math.random() < .45) ? pickWord(HOME_WORDS, 2, 2 + l) : mash(l < 3 ? 'asdfjkl;' : 'asdfghjkl;', span(l, 1, 5)) },
  { name: 'TOP ROW', desc: 'QWERTYUIOP. Reach up and come back home. Words at level 4.',
    gen: l => (l >= 4 && Math.random() < .5) ? pickWord(TOP_WORDS, 2, 2 + l) : mash('qwertyuiop', span(l, 1, 5)) },
  { name: 'BOTTOM ROW', desc: 'ZXCVBNM. The awkward row. Punctuation joins at level 3.',
    gen: l => mash(l < 3 ? 'zxcvbnm' : 'zxcvbnm,./', span(l, 1, 5)) },
  { name: 'ALL LETTERS', desc: 'Random letter clusters from the whole keyboard. No words to lean on.',
    gen: l => mash('abcdefghijklmnopqrstuvwxyz', span(l, 2, 6)) },
  { name: 'WORDS', desc: 'Common English words. Longer words as you climb. Capitals at level 6.',
    mdesc: 'Common English words. Longer words as you climb.',
    gen: l => { const w = pickWord(WORDS, 2, 2 + l); return (l >= 6 && Math.random() < .3) ? w[0].toUpperCase() + w.slice(1) : w; } },
  { name: 'NUMBERS', desc: 'The number row. Prices, times and phone numbers at level 7.',
    mdesc: 'The number row. Decimals at level 4, phone numbers at level 7.',
    gen: l => {
      if (l <= 3) return digits(span(l, 1, 3));
      if (l <= 6) return Math.random() < .7 ? digits(span(l, 3, 5)) : `${digits(1)}.${digits(2)}`;
      if (MOBILE) return rnd([() => `${digits(3)}-${digits(4)}`, () => `${digits(1)}.${digits(2)}`, () => `-${digits(2)}`, () => digits(span(l, 4, 7))])();
      return rnd([
        () => `${digits(3)}-${digits(4)}`, () => `$${digits(2)}.${digits(2)}`, () => `${digits(1)},${digits(3)}`,
        () => `${1 + (Math.random() * 12 | 0)}:${String(Math.random() * 60 | 0).padStart(2, '0')}`,
        () => `${1 + (Math.random() * 99 | 0)}%`, () => `#${digits(3)}`, () => `(${digits(3)})`, () => digits(span(l, 4, 7)),
      ])();
    } },
  { name: 'SYMBOLS', desc: 'Shift and pinky punishment. !@#$%. Brackets and slashes from level 4.',
    gen: l => {
      if (l <= 3) return mash('!@#$%&*()', span(l, 1, 2));
      if (l <= 6) return mash('!@#$%^&*()-_=+[]{};:\'",.<>/?', span(l, 2, 3));
      return Math.random() < .5 ? rnd(SYM_BITS) : mash('!@#$%^&*()-_=+[]{};:\'",.<>/?\\|`~', span(l, 3, 4));
    } },
  { name: 'CODE', desc: 'Programmer tokens: i++, arr[i], x=>x*2, #[test]. Gets gnarly fast.',
    gen: l => rnd(l <= 3 ? CODE[0] : l <= 6 ? CODE[0].concat(CODE[1]) : CODE[1].concat(CODE[2])) },
  { name: 'CHAOS', desc: 'Everything at once, with random capitals from level 3.',
    gen: l => {
      const s = DRILLS[Math.random() * 8 | 0].gen(l);
      return l >= 3 ? s.replace(/[a-z]/g, c => Math.random() < .25 ? c.toUpperCase() : c) : s;
    } },
];
const DRILL_IDS = MOBILE ? [0, 1, 2, 3, 4, 5] : DRILLS.map((_, i) => i);
const MODES = [
  { name: 'NORMAL', mult: 1, desc: 'Labeled keys, finger colors, and a glow on the next key to press.' },
  { name: 'BLIND', mult: 1.5, desc: 'Blank keycaps, like the skins in typing class. Keys flash when you hit them. 1.5x score.' },
  { name: 'INSANE', mult: 2, desc: 'No keyboard. Your typing is hidden. Rocks fall 20% faster. 2x score.' },
];

// ---------- desktop keyboard layout ----------
const ROWS = [
  [['Backquote', '`', '~'], ['Digit1', '1', '!'], ['Digit2', '2', '@'], ['Digit3', '3', '#'], ['Digit4', '4', '$'], ['Digit5', '5', '%'], ['Digit6', '6', '^'], ['Digit7', '7', '&'], ['Digit8', '8', '*'], ['Digit9', '9', '('], ['Digit0', '0', ')'], ['Minus', '-', '_'], ['Equal', '=', '+'], ['Backspace', 'BKSP', null, 2]],
  [['Tab', 'TAB', null, 1.5], ...'qwertyuiop'.split('').map(c => ['Key' + c.toUpperCase(), c]), ['BracketLeft', '[', '{'], ['BracketRight', ']', '}'], ['Backslash', '\\', '|', 1.5]],
  [['CapsLock', 'CAPS', null, 1.75], ...'asdfghjkl'.split('').map(c => ['Key' + c.toUpperCase(), c]), ['Semicolon', ';', ':'], ['Quote', "'", '"'], ['Enter', 'ENTER', null, 2.25]],
  [['ShiftLeft', 'SHIFT', null, 2.25], ...'zxcvbnm'.split('').map(c => ['Key' + c.toUpperCase(), c]), ['Comma', ',', '<'], ['Period', '.', '>'], ['Slash', '/', '?'], ['ShiftRight', 'SHIFT', null, 2.75]],
  [['Space', '', null, 6.25, 4.375]],
];
const FINGERS = {
  p: 'Backquote Digit1 KeyQ KeyA KeyZ Tab CapsLock ShiftLeft Digit0 Minus Equal Backspace KeyP BracketLeft BracketRight Backslash Semicolon Quote Enter Slash ShiftRight',
  r: 'Digit2 KeyW KeyS KeyX Digit9 KeyO KeyL Period',
  m: 'Digit3 KeyE KeyD KeyC Digit8 KeyI KeyK Comma',
  i: 'Digit4 Digit5 KeyR KeyT KeyF KeyG KeyV KeyB Digit6 Digit7 KeyY KeyU KeyH KeyJ KeyN KeyM',
  t: 'Space',
};
const FINGER_COLOR = { p: '#c0507a', r: '#c9853a', m: '#b8b03a', i: '#3fae5e', t: '#6a6690' };
const LEFT_HAND = new Set('Backquote Digit1 Digit2 Digit3 Digit4 Digit5 KeyQ KeyW KeyE KeyR KeyT KeyA KeyS KeyD KeyF KeyG KeyZ KeyX KeyC KeyV KeyB'.split(' '));
const U = 36, KB_X = (960 - 15 * U) / 2, PITCH = 22, KH = 19;
const KEYS = [];
const CHAR2KEY = { ' ': { code: 'Space', shift: false } };
ROWS.forEach((row, ri) => {
  let x = 0;
  row.forEach(([code, label, shifted, units = 1, offset]) => {
    if (offset !== undefined) x = offset;
    const finger = Object.keys(FINGERS).find(f => FINGERS[f].split(' ').includes(code));
    KEYS.push({ code, label, row: ri, x: KB_X + x * U, w: units * U - 3, finger });
    if (label.length === 1) {
      CHAR2KEY[label] = { code, shift: false };
      const up = shifted || (/[a-z]/.test(label) ? label.toUpperCase() : null);
      if (up) CHAR2KEY[up] = { code, shift: true };
    }
    x += units;
  });
});

// ---------- touch keyboard layout ----------
const TK_ROWS = ['1234567890', 'qwertyuiop', 'asdfghjkl;', 'zxcvbnm,./'];
const TK_PITCH = 62, TK_H = 56;
let TKEYS = [];
const L = {};
function layout() {
  if (MOBILE) {
    W = 540;
    H = clamp(Math.round(540 * innerHeight / innerWidth), 860, 1200);
    L.kbY = H - 5 * TK_PITCH - 30;
    L.inputY = L.kbY - 58;
    L.groundY = L.inputY - 46;
    const kw = (W - 12) / 10;
    TKEYS = [];
    TK_ROWS.forEach((row, ri) => [...row].forEach((c, i) =>
      TKEYS.push({ code: CHAR2KEY[c].code, label: c, ch: c, x: 6 + i * kw, y: L.kbY + ri * TK_PITCH, w: kw })));
    let x = 6;
    [['Minus', '-', '-', 1.5], ['Backspace', 'DEL', null, 3], ['Enter', 'FIRE', null, 5.5]].forEach(([code, label, ch, units]) => {
      TKEYS.push({ code, label, ch, x, y: L.kbY + 4 * TK_PITCH, w: units * kw });
      x += units * kw;
    });
  } else {
    W = 960; H = 540;
  }
  cv.width = W; cv.height = H;
  wrap.style.aspectRatio = `${W} / ${H}`;
  wrap.style.width = `min(100vw, calc(100dvh * ${W / H}))`;
}

// ---------- audio ----------
let actx = null;
function audio() {
  if (!S.cfg.sound) return null;
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(type, f0, f1, dur, vol, delay = 0) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, cutoff) {
  const a = audio(); if (!a) return;
  const buf = a.createBuffer(1, a.sampleRate * dur | 0, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; f.type = 'lowpass'; f.frequency.value = cutoff; g.gain.value = vol;
  src.connect(f).connect(g).connect(a.destination); src.start();
}
const sfx = {
  key: () => tone('square', 1800, 1700, .02, .015),
  laser: () => tone('square', 1400, 180, .16, .06),
  boom: () => { noise(.4, .35, 900); tone('triangle', 140, 40, .35, .2); },
  hit: () => { noise(.7, .5, 500); tone('sawtooth', 220, 35, .6, .15); },
  miss: () => { tone('square', 160, 110, .12, .06); tone('square', 120, 80, .14, .06, .12); },
  level: () => [523, 659, 784, 1047].forEach((f, i) => tone('square', f, f, .1, .05, i * .09)),
};

// ---------- state ----------
const saved = JSON.parse(localStorage.getItem('keystroids:cfg') || '{}');
const S = {
  state: 'menu',
  cfg: { drill: 4, level: 1, mode: 0, sound: true, ...saved },
  menuRow: 0, clock: 0, buttons: [],
  rocks: [], particles: [], floaters: [], beams: [], flash: {},
};
if (MOBILE) { S.cfg.mode = 0; if (!DRILL_IDS.includes(S.cfg.drill)) S.cfg.drill = 4; }
layout();
S.stars = Array.from({ length: 140 }, () => ({ x: Math.random() * W, y: Math.random() * H, z: 1 + Math.random() * 2 | 0 }));
const groundY = () => MOBILE ? L.groundY : S.cfg.mode === 2 ? 470 : 380;
const bestKey = () => `keystroids:best:${S.cfg.drill}:${S.cfg.mode}${MOBILE ? ':m' : ''}`;
const best = () => +localStorage.getItem(bestKey()) || 0;

function startGame() {
  Object.assign(S, {
    state: 'play', level: S.cfg.level, score: 0, lives: 3, combo: 0, kills: 0, buffer: '',
    rocks: [], particles: [], floaters: [], beams: [], flash: {}, spawnT: .6, t: 0,
    goodChars: 0, keystrokes: 0, errors: 0, misses: {}, shake: 0, redFlash: 0, turretAngle: -Math.PI / 2,
    banner: { text: `LEVEL ${S.cfg.level}`, sub: DRILLS[S.cfg.drill].name, t: 2.2 }, newBest: false,
  });
  menuEl.classList.add('hidden');
  audio();
}
function toMenu() {
  Object.assign(S, { state: 'menu', rocks: [], particles: [], floaters: [], beams: [], buffer: '' });
  menuEl.classList.remove('hidden');
  renderMenu();
}
function pause() { if (S.state === 'play') S.state = 'paused'; }
function gameOver() {
  S.state = 'over';
  S.overReady = S.clock + 1;
  if (S.score > best()) { localStorage.setItem(bestKey(), S.score); S.newBest = true; }
}

function params() {
  const lv = S.level || 1;
  const fieldScale = MOBILE ? groundY() / 380 * .8 : 1;
  return {
    speed: (20 + 7 * (lv - 1)) * (S.cfg.mode === 2 ? 1.2 : 1) * fieldScale,
    interval: Math.max(.8, 3 - .22 * (lv - 1)),
    max: 3 + Math.floor(lv / 2),
  };
}

function spawnRock(attract) {
  const drill = DRILLS[S.cfg.drill];
  const lv = attract ? 1 + Math.random() * 8 | 0 : S.level;
  let text;
  for (let i = 0; i < 10; i++) {
    text = drill.gen(lv);
    if (MOBILE) text = text.toLowerCase();
    if (!S.rocks.some(r => r.text === text)) break;
  }
  ctx.font = `${12 * FS}px ${FONT}`;
  const tw = ctx.measureText(text).width;
  const r = clamp(tw / 2 + 14, 22 * FS, 46 * FS);
  let x = 0;
  for (let i = 0; i < 14; i++) {
    x = rand(r + 12, W - r - 12);
    if (!S.rocks.some(o => o.y < o.r * 3 && Math.abs(o.x - x) < o.r + r + 20)) break;
  }
  const n = 11, pts = [];
  for (let i = 0; i < n; i++) pts.push([Math.cos(i / n * Math.PI * 2), Math.sin(i / n * Math.PI * 2), rand(.75, 1.05)]);
  const craters = Array.from({ length: 3 }, () => [rand(-.45, .45), rand(-.45, .45), rand(.12, .22)]);
  const sp = attract ? rand(18, 40) * FS : params().speed * rand(.85, 1.15);
  S.rocks.push({ text, x, y: -r, r, vy: sp, rot: 0, vr: rand(-.6, .6), pts, craters });
}

function focusRock() {
  const live = S.rocks.filter(r => !r.dead);
  const pool = S.buffer ? live.filter(r => r.text.startsWith(S.buffer)) : live;
  if (S.buffer && !pool.length) return null;
  return pool.reduce((a, b) => (!a || b.y > a.y) ? b : a, null);
}
function nextChar() {
  const f = focusRock();
  if (!f) return S.buffer ? 'BS' : null;
  return S.buffer.length < f.text.length ? f.text[S.buffer.length] : 'ENTER';
}

function burst(x, y, colors, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = rand(spd * .2, spd);
    S.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(.4, .9), max: .9, c: rnd(colors), s: rand(2, 5) * FS | 0 });
  }
}
function floater(text, x, y, c) { S.floaters.push({ text, x, y, c, life: 1 }); }

function fire() {
  if (!S.buffer) return;
  const hits = S.rocks.filter(r => !r.dead && r.text === S.buffer);
  const tx = W / 2, ty = groundY() + 4;
  if (hits.length) {
    const a = hits.reduce((p, c) => c.y > p.y ? c : p);
    a.dead = true;
    S.combo++;
    const mult = Math.min(5, 1 + Math.floor(S.combo / 5));
    const pts = Math.round(a.text.length * 10 * S.level * mult * MODES[S.cfg.mode].mult);
    S.score += pts;
    S.kills++;
    S.goodChars += a.text.length + 1;
    S.turretAngle = Math.atan2(a.y - ty, a.x - tx);
    S.beams.push({ x1: tx + Math.cos(S.turretAngle) * 26, y1: ty + Math.sin(S.turretAngle) * 26, x2: a.x, y2: a.y, t: .16 });
    burst(a.x, a.y, ['#fff', AMBER, '#ff5a1f', DIM, '#5a4f78'], 28, 240);
    floater(`+${pts}`, a.x, a.y, mult > 1 ? AMBER : GREEN);
    sfx.laser(); sfx.boom();
    if (S.kills % 10 === 0) {
      S.level++;
      S.banner = { text: `LEVEL ${S.level}`, sub: 'FASTER', t: 2 };
      if (S.level % 3 === 0 && S.lives < 3) { S.lives++; S.banner.sub = 'SHIELD RESTORED'; }
      sfx.level();
    }
  } else {
    S.combo = 0;
    S.errors++;
    if (MOBILE) floater('MISS', W / 2, L.inputY - 14, RED);
    else floater('MISS', W / 2 + 180, groundY() - 14, RED);
    sfx.miss();
  }
  S.buffer = '';
}

function hitGround(a) {
  a.dead = true;
  S.lives--;
  S.combo = 0;
  S.shake = .45;
  S.redFlash = .35;
  burst(a.x, groundY(), [RED, AMBER, '#fff', '#5a4f78'], 40, 300);
  sfx.hit();
  if (S.lives <= 0) gameOver();
}

// ---------- input ----------
function typeChar(c, code) {
  const expected = nextChar();
  const nb = (S.buffer + c).slice(0, 24);
  const ok = S.rocks.some(r => !r.dead && r.text.startsWith(nb));
  S.keystrokes++;
  if (!ok) {
    S.errors++;
    if (expected && expected.length === 1) S.misses[expected] = (S.misses[expected] || 0) + 1;
  }
  S.buffer = nb;
  S.flash[code] = { t: .2, c: ok ? GREEN : RED };
  sfx.key();
}
function backspace() {
  S.buffer = S.buffer.slice(0, -1);
  S.flash.Backspace = { t: .2, c: '#fff' };
  sfx.key();
}
function fireKey() {
  if (S.buffer) S.keystrokes++;
  S.flash.Enter = { t: .2, c: S.rocks.some(r => !r.dead && r.text === S.buffer) ? GREEN : RED };
  fire();
}

const menuEl = document.getElementById('menu');
const MENU_ROWS = [
  { label: 'DRILL', get: () => DRILLS[S.cfg.drill].name,
    step: d => { const i = DRILL_IDS.indexOf(S.cfg.drill); S.cfg.drill = DRILL_IDS[(i + d + DRILL_IDS.length) % DRILL_IDS.length]; } },
  { label: MOBILE ? 'LEVEL' : 'START LEVEL', get: () => S.cfg.level, step: d => S.cfg.level = clamp(S.cfg.level + d, 1, 15) },
  { label: 'MODE', get: () => MODES[S.cfg.mode].name, step: d => S.cfg.mode = (S.cfg.mode + d + MODES.length) % MODES.length },
  { label: 'SOUND', get: () => S.cfg.sound ? 'ON' : 'OFF', step: () => S.cfg.sound = !S.cfg.sound },
].filter(m => !(MOBILE && m.label === 'MODE'));
function renderMenu() {
  const rows = document.getElementById('rows');
  rows.innerHTML = '';
  MENU_ROWS.forEach((m, i) => {
    const el = document.createElement('div');
    el.className = 'row' + (i === S.menuRow ? ' sel' : '');
    el.innerHTML = `<span class="label">${m.label}</span><span class="val"><span class="arrow" data-d="-1">&#9664;</span><span>${m.get()}</span><span class="arrow" data-d="1">&#9654;</span></span>`;
    el.addEventListener('click', e => {
      S.menuRow = i;
      const d = +(e.target.dataset.d || 0);
      if (d) m.step(d);
      saveCfg(); renderMenu();
    });
    rows.appendChild(el);
  });
  const drill = DRILLS[S.cfg.drill];
  document.getElementById('desc').textContent = MOBILE
    ? `${drill.mdesc || drill.desc} Tap the keys, then FIRE.`
    : `${drill.desc} ${MODES[S.cfg.mode].desc}`;
  const b = best();
  document.getElementById('best').textContent = b ? `BEST ${String(b).padStart(7, '0')}` : '';
}
function saveCfg() { localStorage.setItem('keystroids:cfg', JSON.stringify(S.cfg)); }
document.getElementById('launch').addEventListener('click', () => { saveCfg(); startGame(); });
if (MOBILE) {
  document.body.classList.add('mobile');
  document.querySelector('.sub').textContent = 'TYPE THE ROCK. HIT FIRE. SAVE THE PLANET.';
  document.getElementById('menuhint').textContent = 'TAP ◀ ▶ TO CHANGE';
}

const HANDLED = new Set(['Enter', 'Backspace', 'Tab', ' ', "'", '/', 'Escape']);
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (HANDLED.has(e.key) || e.key.length === 1 || e.key.startsWith('Arrow')) e.preventDefault();

  if (S.state === 'menu') {
    const m = MENU_ROWS[S.menuRow];
    if (e.key === 'ArrowUp') S.menuRow = (S.menuRow + MENU_ROWS.length - 1) % MENU_ROWS.length;
    else if (e.key === 'ArrowDown') S.menuRow = (S.menuRow + 1) % MENU_ROWS.length;
    else if (e.key === 'ArrowLeft') m.step(-1);
    else if (e.key === 'ArrowRight') m.step(1);
    else if (e.key === 'Enter') { saveCfg(); startGame(); return; }
    else return;
    saveCfg(); renderMenu();
    return;
  }
  if (S.state === 'paused') {
    if (e.key === 'Enter' || e.key === 'Escape') S.state = 'play';
    else if (e.key.toLowerCase() === 'q') toMenu();
    return;
  }
  if (S.state === 'over') {
    if (S.clock < S.overReady) return;
    if (e.key === 'Enter') startGame();
    else if (e.key === 'Escape') toMenu();
    return;
  }
  if (S.state !== 'play') return;

  if (e.key === 'Escape') pause();
  else if (e.key === 'Enter') fireKey();
  else if (e.key === 'Backspace') backspace();
  else if (e.key.length === 1) typeChar(MOBILE ? e.key.toLowerCase() : e.key, e.code);
  else if (e.code) S.flash[e.code] = { t: .2, c: '#fff' };
});

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  audio();
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  const btn = S.buttons.find(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
  if (btn) { btn.action(); return; }
  if (S.state !== 'play' || !MOBILE) return;
  const k = TKEYS.find(k => x >= k.x && x < k.x + k.w && y >= k.y - 3 && y < k.y + TK_PITCH - 3);
  if (!k) return;
  if (k.code === 'Enter') fireKey();
  else if (k.code === 'Backspace') backspace();
  else typeChar(k.ch, k.code);
  if (navigator.vibrate) navigator.vibrate(8);
});
window.addEventListener('blur', pause);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
window.addEventListener('resize', () => { if (MOBILE) layout(); });

// ---------- update ----------
function update(dt) {
  S.clock += dt;
  if (S.state === 'paused') return;
  for (const s of S.stars) { s.y += s.z * s.z * 6 * dt; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }
  for (const p of S.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 120 * dt; p.life -= dt; }
  S.particles = S.particles.filter(p => p.life > 0);
  for (const f of S.floaters) { f.y -= 30 * dt; f.life -= dt; }
  S.floaters = S.floaters.filter(f => f.life > 0);
  for (const b of S.beams) b.t -= dt;
  S.beams = S.beams.filter(b => b.t > 0);
  for (const k in S.flash) if ((S.flash[k].t -= dt) <= 0) delete S.flash[k];

  if (S.state === 'menu') {
    S.spawnT = (S.spawnT || 0) - dt;
    if (S.spawnT <= 0 && S.rocks.length < 6) { spawnRock(true); S.spawnT = 1.4; }
    for (const r of S.rocks) { r.y += r.vy * dt; r.rot += r.vr * dt; }
    S.rocks = S.rocks.filter(r => r.y < H + 60);
    return;
  }
  if (S.state !== 'play') return;

  S.t += dt;
  S.shake = Math.max(0, S.shake - dt);
  S.redFlash = Math.max(0, S.redFlash - dt);
  if (S.banner) { S.banner.t -= dt; if (S.banner.t <= 0) S.banner = null; }
  const P = params();
  S.spawnT -= dt;
  const live = S.rocks.filter(r => !r.dead).length;
  if ((S.spawnT <= 0 && live < P.max) || live === 0) { spawnRock(false); S.spawnT = P.interval * rand(.8, 1.2); }
  const gy = groundY();
  for (const r of S.rocks) {
    if (r.dead) continue;
    r.y += r.vy * dt;
    r.rot += r.vr * dt;
    if (r.y + r.r * .6 >= gy) hitGround(r);
  }
  S.rocks = S.rocks.filter(r => !r.dead);
  S.turretAngle += (-Math.PI / 2 - S.turretAngle) * Math.min(1, dt * 3);
}

// ---------- render ----------
function text(s, x, y, size, color, align = 'left') {
  ctx.font = `${size * FS}px ${FONT}`;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
}
function button(label, cx, y, w, h, color, action) {
  const x = cx - w / 2;
  ctx.fillStyle = '#05040d';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2 * FS;
  ctx.strokeRect(x, y, w, h);
  text(label, cx, y + h / 2 + 1, 10, color, 'center');
  S.buttons.push({ x, y, w, h, action });
}
const HEART = ['0110110', '1111111', '1111111', '0111110', '0011100', '0001000'];
function heart(x, y, on) {
  const px = 3 * FS;
  ctx.fillStyle = on ? RED : '#3a2a3a';
  HEART.forEach((row, j) => [...row].forEach((c, i) => { if (c === '1') ctx.fillRect(x + i * px, y + j * px, px, px); }));
}

function drawRock(r, focus) {
  const gy = groundY();
  const danger = S.state === 'play' && r.y > gy - 110 * FS;
  ctx.save();
  ctx.translate(r.x, r.y);
  ctx.rotate(r.rot);
  ctx.beginPath();
  r.pts.forEach(([cx, cy, k], i) => { const px = cx * r.r * k, py = cy * r.r * k; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
  ctx.closePath();
  ctx.fillStyle = '#2b2440';
  ctx.fill();
  ctx.lineWidth = 2 * FS;
  ctx.strokeStyle = danger && Math.sin(S.clock * 14) > 0 ? RED : focus ? AMBER : DIM;
  ctx.stroke();
  ctx.strokeStyle = '#453b62';
  for (const [cx, cy, cr] of r.craters) { ctx.beginPath(); ctx.arc(cx * r.r, cy * r.r, cr * r.r, 0, Math.PI * 2); ctx.stroke(); }
  ctx.restore();

  ctx.font = `${12 * FS}px ${FONT}`;
  const cw = ctx.measureText('M').width, tw = cw * r.text.length;
  ctx.fillStyle = 'rgba(5,4,13,.78)';
  ctx.fillRect(r.x - tw / 2 - 5, r.y - 10 * FS, tw + 10, 20 * FS);
  const matched = S.state === 'play' && S.cfg.mode !== 2 && S.buffer && r.text.startsWith(S.buffer) ? S.buffer.length : 0;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  [...r.text].forEach((c, i) => {
    ctx.fillStyle = i < matched ? GREEN : danger ? '#ffd0d0' : '#fff';
    ctx.fillText(c, r.x - tw / 2 + i * cw, r.y + 1);
  });
}

function hintCodes() {
  if (S.state !== 'play' || S.cfg.mode !== 0) return new Set();
  const nc = nextChar();
  if (!nc) return new Set();
  if (nc === 'ENTER') return new Set(['Enter']);
  if (nc === 'BS') return new Set(['Backspace']);
  const k = CHAR2KEY[nc];
  if (!k) return new Set();
  const s = new Set([k.code]);
  if (k.shift && !MOBILE) s.add(LEFT_HAND.has(k.code) ? 'ShiftRight' : 'ShiftLeft');
  return s;
}

function drawKeyboard() {
  if (S.cfg.mode === 2) return;
  const blind = S.cfg.mode === 1;
  const y0 = groundY() + 44;
  const hints = hintCodes();
  const pulse = .55 + .45 * Math.sin(S.clock * 8);
  ctx.fillStyle = '#0d0b1a';
  ctx.fillRect(KB_X - 10, y0 - 8, 15 * U + 17, 5 * PITCH + 12);
  ctx.strokeStyle = '#2a2640';
  ctx.lineWidth = 2;
  ctx.strokeRect(KB_X - 10, y0 - 8, 15 * U + 17, 5 * PITCH + 12);
  for (const k of KEYS) {
    const y = y0 + k.row * PITCH;
    const fc = FINGER_COLOR[k.finger] || '#666';
    const fl = S.flash[k.code];
    let fill = blind ? '#1c1a2c' : fc + '40';
    let stroke = blind ? '#3a3650' : fc;
    if (hints.has(k.code)) { fill = `rgba(255,176,0,${pulse})`; stroke = AMBER; }
    if (fl) { fill = fl.c; stroke = fl.c; }
    ctx.fillStyle = fill;
    ctx.fillRect(k.x, y, k.w, KH);
    ctx.lineWidth = 1;
    ctx.strokeStyle = stroke;
    ctx.strokeRect(k.x + .5, y + .5, k.w - 1, KH - 1);
    if (!blind && k.label) text(k.label, k.x + k.w / 2, y + KH / 2 + 1, 8, (fl || hints.has(k.code)) ? '#000' : '#e8e4f8', 'center');
    if (k.code === 'KeyF' || k.code === 'KeyJ') { ctx.fillStyle = fl ? '#000' : blind ? '#6a6690' : '#fff'; ctx.fillRect(k.x + k.w / 2 - 5, y + KH - 5, 10, 2); }
  }
}

function drawTouchKeyboard() {
  const hints = hintCodes();
  const pulse = .55 + .45 * Math.sin(S.clock * 8);
  ctx.fillStyle = '#0d0b1a';
  ctx.fillRect(0, L.kbY - 10, W, H - L.kbY + 10);
  ctx.fillStyle = '#2a2640';
  ctx.fillRect(0, L.kbY - 10, W, 2);
  for (const k of TKEYS) {
    const x = k.x + 3, w = k.w - 6;
    const fl = S.flash[k.code];
    const isFire = k.code === 'Enter';
    let fill = isFire ? '#0f2a12' : '#1c1a2c', stroke = isFire ? GREEN : '#4a4566';
    if (hints.has(k.code)) { fill = `rgba(255,176,0,${pulse})`; stroke = AMBER; }
    if (fl) { fill = fl.c; stroke = fl.c; }
    ctx.fillStyle = fill;
    ctx.fillRect(x, k.y, w, TK_H);
    ctx.lineWidth = 2;
    ctx.strokeStyle = stroke;
    ctx.strokeRect(x + 1, k.y + 1, w - 2, TK_H - 2);
    const dark = fl || hints.has(k.code);
    text(k.label, x + w / 2, k.y + TK_H / 2 + 2, k.label.length > 1 ? 9 : 12, dark ? '#000' : isFire ? GREEN : '#e8e4f8', 'center');
  }
}

function drawGround() {
  const gy = groundY();
  ctx.fillStyle = '#120f22';
  ctx.fillRect(0, gy, W, 38);
  ctx.fillStyle = '#2a2250';
  for (let x = 0; x < W; x += 8) if ((x / 8) % 3 === 0) ctx.fillRect(x, gy + 6 + ((x * 7) % 11), 4, 2);
  ctx.fillStyle = GREEN;
  ctx.fillRect(0, gy, W, 2);

  const tx = W / 2, ty = gy + 4;
  ctx.save();
  ctx.translate(tx, ty);
  ctx.rotate(S.turretAngle || -Math.PI / 2);
  ctx.fillStyle = '#cfc8e8';
  ctx.fillRect(0, -4, 26, 8);
  ctx.fillStyle = GREEN;
  ctx.fillRect(22, -3, 4, 6);
  ctx.restore();
  ctx.fillStyle = '#6a6690';
  ctx.beginPath(); ctx.arc(tx, ty, 16, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#3a3650';
  ctx.fillRect(tx - 26, ty, 52, 10);

  if (S.state === 'menu') return;
  let bx, by, bw, bh;
  if (MOBILE) { bx = 10; by = L.inputY; bw = W - 20; bh = 42; }
  else {
    text(`${DRILLS[S.cfg.drill].name} / ${MODES[S.cfg.mode].name}`, 16, gy + 20, 8, DIM);
    bx = tx + 44; by = gy + 8; bw = 300; bh = 24;
  }
  ctx.fillStyle = '#05040d';
  ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = S.buffer && S.state === 'play' && S.cfg.mode !== 2 && !S.rocks.some(r => r.text.startsWith(S.buffer)) ? RED : GREEN;
  ctx.lineWidth = 2;
  ctx.strokeRect(bx, by, bw, bh);
  const shown = S.cfg.mode === 2 ? '*'.repeat(S.buffer.length) : S.buffer;
  const cursor = Math.sin(S.clock * 8) > 0 ? '_' : ' ';
  text('> ' + shown + cursor, bx + 8, by + bh / 2 + 1, 12, '#fff');
}

function stats() {
  const mins = S.t / 60;
  return {
    wpm: mins > .05 ? Math.round(S.goodChars / 5 / mins) : 0,
    acc: S.keystrokes ? clamp(Math.round((1 - S.errors / S.keystrokes) * 100), 0, 100) : 100,
    mult: Math.min(5, 1 + Math.floor(S.combo / 5)),
  };
}

function drawHud() {
  const { wpm, acc, mult } = stats();
  if (MOBILE) {
    text('SCORE ' + String(S.score).padStart(7, '0'), 12, 26, 11, '#fff');
    for (let i = 0; i < 3; i++) heart(W - 168 + i * 34, 12, i < S.lives);
    if (S.state === 'play') {
      ctx.fillStyle = '#cfc8e8';
      ctx.fillRect(W - 36, 12, 8, 28);
      ctx.fillRect(W - 22, 12, 8, 28);
      S.buttons.push({ x: W - 56, y: 0, w: 56, h: 56, action: pause });
    }
    text(`LVL ${S.level}`, 12, 62, 9, AMBER);
    if (S.combo > 1) text(`x${mult} COMBO ${S.combo}`, W / 2, 62, 7, mult > 1 ? AMBER : DIM, 'center');
    text(`WPM ${wpm} ACC ${acc}%`, W - 12, 62, 7, DIM, 'right');
    return;
  }
  text('SCORE ' + String(S.score).padStart(7, '0'), 16, 20, 12, '#fff');
  text(`WPM ${wpm}  ACC ${acc}%`, 16, 40, 8, DIM);
  text(`LEVEL ${S.level}`, W / 2, 20, 12, AMBER, 'center');
  if (S.combo > 1) text(`COMBO ${S.combo}  x${mult}`, W / 2, 40, 8, mult > 1 ? AMBER : DIM, 'center');
  for (let i = 0; i < 3; i++) heart(W - 90 + i * 26, 12, i < S.lives);
  text('BEST ' + String(Math.max(best(), S.score)).padStart(7, '0'), W - 16, 40, 8, DIM, 'right');
}

function overlay(lines) {
  ctx.fillStyle = 'rgba(5,4,13,.84)';
  ctx.fillRect(0, 0, W, H);
  const y0 = MOBILE ? H * .2 : 150, gap = 36 * FS;
  lines.forEach(([s, size, c], i) => text(s, W / 2, y0 + i * gap, size, c, 'center'));
  return y0 + lines.length * gap;
}

function render() {
  S.buttons = [];
  ctx.save();
  if (S.shake > 0) ctx.translate(rand(-6, 6) * S.shake * 2, rand(-6, 6) * S.shake * 2);
  ctx.fillStyle = '#05040d';
  ctx.fillRect(-10, -10, W + 20, H + 20);
  for (const s of S.stars) { ctx.fillStyle = ['', '#3a3660', '#8a86b0', '#ffffff'][s.z]; ctx.fillRect(s.x | 0, s.y | 0, s.z, s.z); }

  const focus = S.state === 'play' && S.cfg.mode !== 2 ? focusRock() : null;
  for (const r of S.rocks) drawRock(r, r === focus);

  for (const b of S.beams) {
    const a = b.t / .16;
    ctx.strokeStyle = `rgba(57,255,20,${a * .35})`; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2); ctx.stroke();
    ctx.strokeStyle = `rgba(220,255,210,${a})`; ctx.lineWidth = 3;
    ctx.stroke();
  }
  for (const p of S.particles) { ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.c; ctx.fillRect(p.x | 0, p.y | 0, p.s, p.s); }
  ctx.globalAlpha = 1;

  drawGround();
  if (MOBILE) drawTouchKeyboard(); else drawKeyboard();
  if (S.state !== 'menu') drawHud();

  for (const f of S.floaters) { ctx.globalAlpha = clamp(f.life, 0, 1); text(f.text, f.x, f.y, 10, f.c, 'center'); }
  ctx.globalAlpha = 1;
  if (S.banner && S.state === 'play') {
    const by = MOBILE ? H * .25 : 170;
    ctx.globalAlpha = clamp(S.banner.t, 0, 1);
    text(S.banner.text, W / 2, by, 28, AMBER, 'center');
    text(S.banner.sub, W / 2, by + 40 * FS, 10, '#fff', 'center');
    ctx.globalAlpha = 1;
  }
  if (S.redFlash > 0) { ctx.fillStyle = `rgba(255,40,40,${S.redFlash * .6})`; ctx.fillRect(-10, -10, W + 20, H + 20); }
  ctx.restore();

  const bw = MOBILE ? 300 : 260, bh = MOBILE ? 64 : 36;
  if (S.state === 'paused') {
    S.buttons = [];
    const y = overlay([['PAUSED', 28, AMBER], ['', 10, '#fff']]);
    button('RESUME', W / 2, y, bw, bh, GREEN, () => { S.state = 'play'; });
    button('QUIT', W / 2, y + bh + 20, bw, bh, DIM, toMenu);
    if (!MOBILE) text('ENTER RESUME / Q QUIT', W / 2, y + 2 * bh + 60, 8, DIM, 'center');
  }
  if (S.state === 'over') {
    S.buttons = [];
    const { wpm, acc } = stats();
    const trouble = Object.entries(S.misses).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([k]) => k === ' ' ? 'SPACE' : k).join('  ');
    const statLines = MOBILE
      ? [[`LEVEL ${S.level}   ROCKS ${S.kills}`, 9, '#cfc8e8'], [`WPM ${wpm}   ACC ${acc}%`, 9, '#cfc8e8']]
      : [[`LEVEL ${S.level}   WPM ${wpm}   ACC ${acc}%   ROCKS ${S.kills}`, 10, '#cfc8e8']];
    const y = overlay([
      ['GAME OVER', 28, RED],
      [S.newBest ? `NEW BEST! ${S.score}` : `SCORE ${S.score}`, 14, S.newBest ? AMBER : '#fff'],
      ...statLines,
      [trouble ? `TROUBLE KEYS: ${trouble}` : 'NO TROUBLE KEYS. NICE.', MOBILE ? 8 : 10, trouble ? AMBER : GREEN],
    ]);
    if (S.clock >= S.overReady) {
      button('PLAY AGAIN', W / 2, y + 10, bw, bh, GREEN, startGame);
      button('MENU', W / 2, y + bh + 30, bw, bh, DIM, toMenu);
      if (!MOBILE) text('ENTER PLAY AGAIN / ESC MENU', W / 2, y + 2 * bh + 70, 8, DIM, 'center');
    }
  }
}

let last = performance.now();
function frame(now) {
  update(Math.min(.05, (now - last) / 1000));
  last = now;
  render();
  requestAnimationFrame(frame);
}
renderMenu();
requestAnimationFrame(frame);
window.S = S;
</script>
</body>
</html>
